[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "intel-edge-ai-demo"
version = "1.0.0"
description = "A local PyTorch versus OpenVINO language-model benchmark"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "openvino>=2026.0,<2027.0",
    "optimum-intel>=2.0,<3.0",
    "psutil>=7.0,<8.0",
    "streamlit>=1.40,<2.0",
    "torch>=2.1,<3.0",
    # Optimum Intel 2.0 currently constrains Transformers below 5.1.
    "transformers>=4.45,<5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "ruff>=0.14,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
